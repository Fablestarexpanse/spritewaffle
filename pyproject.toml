[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spritewaffle"
version = "0.1.0"
description = "AI image/video -> game-ready pixel-art sprite sets"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "Pillow==11.0.0",
  "opencv-python-headless==4.10.0.84",
  "websockets==13.1",
  "fastapi==0.115.5",
  "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[project.scripts]
spritewaffle = "spritewaffle.cli:main"

[tool.setuptools.package-data]
spritewaffle = ["ui/static/*"]

[tool.setuptools.packages.find]
include = ["spritewaffle*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
