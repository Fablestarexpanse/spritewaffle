<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpriteWaffle</title>
<style>
  :root {
    --bg: #121317; --panel: #1b1d23; --panel2: #23262e; --line: #2f333d; --text: #e7e7ea; --muted: #9a9daa;
    --accent: #f2b33d; --accent-ink: #1d1e22; --ok: #4fbf73; --bad: #e0554f; --warn: #e3a63a; --run: #5aa2e8;
    --radius: 8px; --shadow: 0 8px 30px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f3f6; --panel: #fff; --panel2: #f6f6f9; --line: #dcdde3; --text: #1c1d21; --muted: #646876; --shadow: 0 8px 30px rgba(0, 0, 0, .12); }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 260px 1fr auto; grid-template-areas: "top top top" "side main queue"; }
  header { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; letter-spacing: .2px; } header h1 b { color: var(--accent); }
  header .ver { color: var(--muted); font-size: 12px; margin-right: auto; }
  aside { grid-area: side; border-right: 1px solid var(--line); overflow: auto; padding: 12px; background: var(--panel); }
  main { grid-area: main; overflow: auto; padding: 18px 22px 40px; }
  #queue { grid-area: queue; width: 340px; border-left: 1px solid var(--line); overflow: auto; padding: 12px; background: var(--panel); }
  #queue.hidden { display: none; }
  h2 { font-size: 15px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h3 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  section, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  label { color: var(--muted); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; } .field > span { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; } .warn { color: var(--warn); font-size: 12px; } .err { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  /* pills & badges */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.run { background: var(--run); }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .badge.approved, .badge.pass, .badge.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .badge.review, .badge.queued, .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .badge.fail, .badge.failed { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .badge.running { color: var(--run); border-color: color-mix(in srgb, var(--run) 45%, transparent); }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--panel2); color: var(--muted); }
  /* images */
  .smooth img.pix { image-rendering: auto; }
  img.pix { image-rendering: pixelated; max-width: 100%; height: auto; display: block; border-radius: 4px;
            background: repeating-conic-gradient(#8883 0 25%, transparent 0 50%) 0 0/16px 16px; }
  .ph { display: grid; place-items: center; aspect-ratio: 1; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); font-size: 12px; }
  /* sidebar jobs */
  .newjob { display: grid; gap: 6px; padding: 10px; background: var(--panel2); border-radius: var(--radius); margin: 8px 0; }
  .job { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 6px; color: inherit; text-decoration: none; }
  .job:hover, .job.on { background: var(--panel2); } .job.on { outline: 1px solid var(--line); }
  .job img, .job .noimg { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; background: var(--bg); image-rendering: pixelated; }
  .jfilters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; font-size: 12px; }
  .jfilters select { font-size: 12px; padding: 2px 4px; max-width: 110px; }
  .jgroup > summary { cursor: pointer; font-weight: 600; padding: 6px 4px 2px; color: var(--muted); font-size: 12px; }
  .job .needs { color: var(--warn, #c80); font-size: 11px; }
  .job .name { font-weight: 600; } .job small { color: var(--muted); display: block; font-size: 11px; }
  /* job header + tabs */
  .jobhead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .jobhead img { width: 56px; height: 56px; object-fit: contain; image-rendering: pixelated; background: var(--panel); border-radius: 6px; border: 1px solid var(--line); }
  .jobhead h2 { margin: 0; font-size: 19px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 14px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--panel2); }
  .tab .n.ok { background: var(--ok); color: #fff; }
  /* grids */
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .card img, .card .ph { aspect-ratio: 1; object-fit: contain; width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 3px; }
.swatches span { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line, #0003); }
.compass { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 560px; }
  .compass .center { display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .compass.small { max-width: 420px; gap: 8px; } .compass.small .card { padding: 6px; gap: 4px; }
  .compass.small .ph { font-size: 11px; border-color: color-mix(in srgb, var(--line) 60%, transparent); }
  .pick { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; }
  .pick label { justify-content: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; height: 32px; color: var(--text); cursor: pointer; }
  .pick label:has(input:checked) { border-color: var(--accent); color: var(--accent); }
  .pick input { display: none; }
  .actrow { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .anim { cursor: pointer; } .anim:hover { border-color: var(--muted); }
  .drift-ok { color: var(--ok); } .drift-warn { color: var(--warn); } .drift-bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  /* queue */
  .task { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 12px; }
  .task code { color: var(--muted); word-break: break-all; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; } .seg button.on { background: var(--accent); color: var(--accent-ink); }
  /* dialog + toast */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); padding: 20px; width: min(900px, 94vw); max-height: 88vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  #viewer { width: auto; max-width: 96vw; max-height: 94vh; padding: 12px; text-align: center; }
  #viewer img { display: block; max-width: calc(96vw - 24px); max-height: calc(94vh - 70px); margin: 0 auto;
    image-rendering: pixelated; background: repeating-conic-gradient(#0002 0 25%, #0000 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
  .takes .take { width: 96px; text-align: center; }
  .takes .take img { width: 96px; height: 96px; object-fit: contain; }
  .prompt { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Consolas, monospace; background: var(--bg, #0001);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 220px; overflow: auto; margin: 4px 0 10px; }
  .pgroup > summary { cursor: pointer; padding: 6px 0; font-weight: 600; }
  .pgroup textarea { width: 100%; min-height: 54px; }
  #dlg .field { align-items: stretch; }
  .ok-note { color: var(--ok, #3a3); margin: 0 0 8px; }
  .pgroup .field { align-items: stretch; margin: 6px 0; }      /* labels left, inputs full width */
  #viewer .bar { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow); max-width: 420px; }
  .toast.bad { border-left-color: var(--bad); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty h2 { justify-content: center; font-size: 20px; color: var(--text); }
  main, aside, #queue { min-width: 0; }
  @media (max-width: 1100px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; grid-template-areas: "top" "side" "main" "queue"; height: auto; }
    header { flex-wrap: wrap; padding: 8px 16px; row-gap: 6px; } header .ver { margin-right: 0; } header h1 { margin-right: auto; }
    aside { max-height: 260px; } #queue { width: auto; } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    main { padding: 14px 16px 30px; }
    .jobhead { flex-wrap: wrap; } .tabs { overflow-x: auto; } .tab { white-space: nowrap; }
    #pane section > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<header>
  <h1><b>Sprite</b>Waffle</h1><span class="ver" id="ver"></span>
  <span class="pill" id="pComfy" title=""><span class="dot"></span>ComfyUI</span>
  <span class="pill" id="pWorker"><span class="dot"></span>Worker</span>
  <span class="pill" id="pQueue">Queue</span>
  <button id="btnLib">Motion library</button>
  <button id="btnQueue">Queue</button>
</header>

<aside>
  <div class="row" style="margin:0">
    <input id="search" placeholder="Search jobs" style="flex:1">
    <button class="primary" id="btnNew">New</button>
  </div>
  <div class="newjob" id="newForm" hidden>
    <input id="nName" placeholder="name, e.g. knight">
    <select id="nType"></select>
    <select id="nStyle"></select>
    <select id="nProfile"></select>
    <div class="row" style="margin:0"><button class="primary" id="nCreate">Create job</button><button class="ghost" id="nCancel">Cancel</button></div>
  </div>
  <div class="jfilters">
    <select id="jfSort" title="Sort"><option value="recent">Recent</option><option value="name">Name</option>
      <option value="todo">Least done</option><option value="done">Most done</option></select>
    <select id="jfType" title="Type"><option value="">All types</option></select>
    <select id="jfStyle" title="Style"><option value="">All styles</option></select>
    <label title="Only jobs waiting for you: something to review, or a clip that failed QA"><input type="checkbox" id="jfNeeds"> Needs me</label>
    <label title="Group jobs under their character"><input type="checkbox" id="jfGroup"> Group</label>
  </div>
  <div id="jobs"></div>
</aside>

<main id="main"></main>

<div id="queue">
  <h2>Queue <span class="spacer"></span>
    <span class="seg" id="qFilter"><button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="failed">Failed</button></span></h2>
  <div class="row" style="margin:0 0 6px"><button class="ghost" id="qClear">Clear finished</button></div>
  <div id="tasks"></div>
</div>

<dialog id="dlg"></dialog>
<dialog id="viewer" aria-label="Image viewer"></dialog>
<div id="toasts"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const COMPASS = ["NW", "N", "NE", "W", null, "E", "SW", "S", "SE"];
const STEPS = {character: ["anchor", "facings", "animations", "export"], creature: ["anchor", "facings", "animations", "export"],
               prop: ["anchor", "stack", "export"]};
const TITLES = {anchor: "Anchor", facings: "Facings", animations: "Animations", export: "Export", stack: "Sprite stack"};

let status = {profiles: [], actions: [], asset_types: []};
let jobsCache = [];
let current = null, tab = null, job = null, lastSig = "", qFilter = "all";
const form = {facings: new Set(["S", "E", "N", "W", "SE", "NE", "NW", "SW"]), actions: new Set(["idle", "walk"]),
              seconds: 2, source: "", mirror: true, set: "12f", includeFailed: false, stackH: 24, maxSize: 4096, flip: false};

// --- plumbing ----------------------------------------------------------------------------
// Enlarged images open here, not in a new tab (a bare image tab has no way back in an app window).
// Esc, the Close button or a click outside the picture closes it.
function viewImage(src, title) {
  const v = $("#viewer");
  v.innerHTML = `<div class="bar"><b>${esc(title || "")}</b><span>
      <a href="${esc(src)}" target="_blank" rel="noopener"><button class="ghost">Open in new tab</button></a>
      <button id="vClose">Close</button></span></div>
    ${/\.(mp4|webm)(\?|$)/i.test(src) ? `<video src="${esc(src)}" controls autoplay loop muted style="max-width:calc(96vw - 24px);max-height:calc(94vh - 70px)"></video>`
      : `<img src="${esc(src)}" alt="${esc(title || "image")}">`}`;
  $("#vClose").onclick = () => v.close();
  v.onclick = e => { if (e.target === v || e.target.tagName === "IMG") v.close(); };
  v.showModal();
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-view]");
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  viewImage(a.getAttribute("href"), a.dataset.view);
});

// Earlier takes of a still or clip: thumbnails (or a play link) + "Use this".
function takesHtml(list, file, label) {
  if (!list || !list.length) return "";
  return `<details class="takes"><summary class="muted">${list.length} earlier take${list.length === 1 ? "" : "s"}</summary>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:6px">${list.map(t => `<div class="take">
      ${t.thumb ? `<a href="${esc(t.url)}" data-view="${esc(label)} · ${esc(t.kept || "")}">${img(t.thumb, label + " take")}</a>`
                : `<a href="${esc(t.url)}" data-view="${esc(label)} · ${esc(t.kept || "")}"><button class="ghost">▶ play</button></a>`}
      <div class="muted" style="font-size:11px">${esc((t.kept || "").replace("_", " "))}${t.seed != null ? ` · seed ${esc(String(t.seed))}` : ""}</div>
      <button class="ghost" data-restore="${esc(file)}|${esc(t.take)}">Use this</button></div>`).join("")}</div></details>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-restore]");
  if (!b) return;
  const [file, take] = b.dataset.restore.split("|");
  if (!confirm("Use this take? The current one is kept as a take, and this step goes back to review.")) return;
  try {
    const r = await api(jobPath() + "/restore", {file, take});
    toast(r.tasks?.length ? "Take restored; re-processing the clip" : "Take restored");
  } finally { $("#dlg").open && $("#dlg").close(); lastSig = ""; refreshAll(); }
});

// --- prompts dialog: what will be sent, what was sent, and the editable creative text ---------
const pendingActs = new Set();            // added in the dialog, not saved yet
async function showPrompts(open = {}) {
  const d = $("#dlg");
  const v = await api(jobPath() + "/prompts");
  pendingActs.forEach(a => { if (!v.actions[a]) v.actions[a] = {source: "new: write motion + transition", spec: {motion: "", transition: "", sound: "", cyclic: false}, edited: {}, preview: null, used: {}}; });
  const pre = (label, text) => text ? `<div class="muted">${label}</div><div class="prompt">${esc(text)}</div>` : "";
  const isOpen = k => open[k] ? "open" : "";
  const act = Object.entries(v.actions);
  d.innerHTML = `<h2>Prompts <span class="muted">${esc(job.character)} · writer: ${esc(v.writer)}</span>
      <span class="spacer"></span><button class="ghost" id="pClose">Close</button></h2>
    <p class="hint" style="margin-top:0">You edit the creative text. The rules around it (green background, framing, in-place motion, style) are always added and can't be removed. Edits apply to the next render.</p>
    <details class="pgroup" ${isOpen("anchor")}><summary>Anchor</summary>
      <p class="muted">Description: <b>${esc(v.anchor.description || "—")}</b> (edit it on the Anchor tab)</p>
      ${v.anchor.visual_description ? pre("AI description of the approved look", v.anchor.visual_description) : ""}
      ${pre("Will send", v.anchor.preview)}${pre("Last sent", v.anchor.used)}
    </details>
    <details class="pgroup" ${isOpen("facings")}><summary>Facings</summary>
      <label class="field"><span>Note for every facing (e.g. "the quiver is always on the back")</span>
        <div class="row"><input data-fnote="*" value="${esc(v.facing_note_all)}" style="flex:1"><button data-fsave="*">Save</button></div></label>
      ${Object.entries(v.facings).map(([f, x]) => `<details ${isOpen("f:" + f)}><summary>${f}${x.note ? " · has a note" : ""}</summary>
        <div class="row"><input data-fnote="${f}" value="${esc(x.note)}" placeholder="note just for ${f}" style="flex:1"><button data-fsave="${f}">Save</button></div>
        ${pre("Will send", x.preview)}${pre("Last sent", x.used)}</details>`).join("")}
    </details>
    <details class="pgroup" ${isOpen("actions")}><summary>Actions</summary>
      <div class="row"><input id="pNewAct" placeholder="new action name, e.g. cast spell" style="width:220px"><button id="pAddAct">Add</button></div>
      ${act.map(([a, x]) => `<details ${isOpen("a:" + a)}><summary>${esc(a)} <span class="chip">${esc(x.source)}</span>${x.spec.cyclic ? ' <span class="muted">loops</span>' : ""}</summary>
        ${["motion", "transition", "sound"].map(k => `<label class="field"><span>${k}${k === "transition" ? " (the first/last pose: a small step from idle)" : k === "motion" ? " (short and literal)" : ""}</span>
          <textarea data-a="${esc(a)}" data-k="${k}">${esc(x.spec[k] || "")}</textarea></label>`).join("")}
        <div class="row"><button class="primary" data-asave="${esc(a)}">Save</button>
          ${Object.keys(x.edited).length ? `<button class="ghost" data-areset="${esc(a)}">Back to ${v.writer === "ai" ? "AI / preset" : "preset"} text</button>` : ""}</div>
        ${x.preview ? pre("Will send: transition pose (facing S)", x.preview.transition) + pre("Will send: video (facing S)", x.preview.video) : ""}
        ${Object.entries(x.used).map(([f, u]) => pre(`Last sent: ${f} video`, u.video)).join("")}
      </details>`).join("")}
    </details>`;
  const keepOpen = () => {
    const o = {};
    $$("#dlg details[open] > summary").forEach(sm => {
      const det = sm.parentElement, t = sm.textContent.trim();
      if (det.classList.contains("pgroup")) o[t.toLowerCase()] = 1;
      else if (det.querySelector("[data-fnote]")) o["f:" + det.querySelector("[data-fnote]").dataset.fnote] = 1;
      else if (det.querySelector("[data-asave]")) o["a:" + det.querySelector("[data-asave]").dataset.asave] = 1;
    });
    return o;
  };
  const save = async body => { await api(jobPath() + "/prompts", body); toast("Saved: used from the next render"); showPrompts(keepOpen()); };
  $("#pClose").onclick = () => d.close();
  $$("[data-fsave]").forEach(b => b.onclick = () =>
    save({kind: "facing", facing: b.dataset.fsave, note: $(`[data-fnote="${b.dataset.fsave}"]`).value}));
  $$("[data-asave]").forEach(b => b.onclick = () => {
    const a = b.dataset.asave, body = {kind: "action", action: a};
    $$(`textarea[data-a="${CSS.escape(a)}"]`).forEach(t => body[t.dataset.k] = t.value);
    pendingActs.delete(a);
    save(body);
  });
  $$("[data-areset]").forEach(b => b.onclick = () => save({kind: "action", action: b.dataset.areset}));
  $("#pAddAct").onclick = () => {
    const a = $("#pNewAct").value.trim().toLowerCase();
    if (!a) return;
    if (v.actions[a]) return toast(`${a} is already in the list`, true);

function toast(msg, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), bad ? 7000 : 3500);
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) {
    let msg = await r.text();
    try { msg = JSON.parse(msg).detail || msg; } catch {}
    toast(msg, true); throw new Error(msg);
  }
  return r.json();
}
const jobPath = () => `/api/jobs/${encodeURIComponent(current.character)}/${encodeURIComponent(current.job_id)}`;
async function run(stage, args = {}, ok = "Queued") {
  const ids = await api(jobPath() + "/run", {stage, args});
  toast(`${ok} (${ids.length} task${ids.length === 1 ? "" : "s"})`); refreshAll();
}
async function approve(stage) { await api(jobPath() + "/approve", {stage}); toast(`${TITLES[stage] || stage} approved`); refreshAll(); }
const badge = (s, label) => s ? `<span class="badge ${esc(s)}">${esc(label || s)}</span>` : "";
const img = (src, alt = "") => src ? `<img class="pix" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">` : `<div class="ph">not yet</div>`;
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const driftCls = d => !d ? "" : (d.color > 0.35 || Math.abs(d.height_ratio - 1) > 0.12) ? "drift-bad" : d.color > 0.25 ? "drift-warn" : "drift-ok";

function jobInfo(j) {
  const steps = STEPS[j.asset_type] || STEPS.character, done = steps.filter(s => stepDone(s, j.stages)).length;

  const failed = vals.filter(([k, v]) => k.startsWith("qa:") && v === "fail").length;

  list.sort(by);
  const sig = JSON.stringify([list.map(j => [j.character, j.job_id, j.thumb, j.info, j.style]), current, jf, q]);

}

function stepDone(step, stages) {
  const st = k => stages[k]?.status ?? stages[k];
  if (step === "anchor") return st("anchor") === "approved";
  if (step === "facings") return st("facings") === "approved";
  if (step === "animations") return Object.keys(stages).some(k => k.startsWith("export:") && k !== "export:character");
  if (step === "stack") return st("stack") === "done";
  if (step === "export") return st("export:character") === "done" || st("stack") === "done";
  return false;
}

      ${t.status === "queued" ? `<button class="ghost" data-cancel="${esc(t.id)}">Cancel</button>` : ""}

// --- refresh loop --------------------------------------------------------------------------
async function loadJob() {
  if (!current) { job = null; renderHome(); return; }
  let j;
  try { j = await api(jobPath()); } catch { current = null; location.hash = ""; return; }
  const sig = JSON.stringify(j) + tab;
  if (sig === lastSig) return;                 // nothing changed: keep typed text and scroll position
  const same = job && job.character === j.character && job.job_id === j.job_id;   // typed text belongs to ONE job
  const keep = same ? {desc: $("#desc")?.value, path: $("#importPath")?.value, sheet: $("#sheetPath")?.value,
                       scroll: $("main").scrollTop} : {scroll: 0};
  job = j; lastSig = sig; renderJob();
  if (keep.desc !== undefined && $("#desc") && keep.desc !== (j.inputs.description || "")) $("#desc").value = keep.desc;
  if (keep.path && $("#importPath")) $("#importPath").value = keep.path;
  if (keep.sheet && $("#sheetPath")) $("#sheetPath").value = keep.sheet;
  $("main").scrollTop = keep.scroll;
}
async function refreshAll() { await loadStatus(); await Promise.all([loadJobs(), loadJob(), loadQueue()]); }

function setHash() { if (current) history.replaceState(null, "", `#${current.character}/${current.job_id}/${tab}`); }
function fromHash() {
  const [c, j, t] = decodeURIComponent(location.hash.slice(1)).split("/");
  current = c && j ? {character: c, job_id: j} : null;
  tab = t || null; lastSig = "";
}

$("#jfSort").value = jf.sort || "recent"; $("#jfNeeds").checked = !!jf.needs; $("#jfGroup").checked = !!jf.group;
$("#jfSort").onchange = e => { jf.sort = e.target.value; saveJf(); };
$("#jfType").onchange = e => { jf.type = e.target.value; saveJf(); };
$("#jfStyle").onchange = e => { jf.style = e.target.value; saveJf(); };
$("#jfNeeds").onchange = e => { jf.needs = e.target.checked; saveJf(); };
$("#jfGroup").onchange = e => { jf.group = e.target.checked; saveJf(); };
$("#btnNew").onclick = () => { fillNewForm(); $("#newForm").hidden = false; $("#nName").focus(); };
$("#nCancel").onclick = () => $("#newForm").hidden = true;
$("#nCreate").onclick = async () => {
  const name = $("#nName").value.trim();
  if (!name) return toast("Give the job a name", true);
  const r = await api("/api/jobs", {character: name, asset_type: $("#nType").value, style: $("#nStyle").value, profile: $("#nProfile").value || null});
  $("#newForm").hidden = true; $("#nName").value = "";
  location.hash = `${r.character}/${r.job_id}/anchor`;
};
$$("#qFilter button").forEach(b => b.onclick = () => { qFilter = b.dataset.f; $$("#qFilter button").forEach(x => x.classList.toggle("on", x === b)); loadQueue(); });
$("#qClear").onclick = async () => { const r = await api("/api/queue/clear", {}); toast(`Removed ${r.removed} finished tasks`); loadQueue(); };
window.addEventListener("hashchange", () => { fromHash(); poll([refreshAll]); });
fromHash();
poll([refreshAll]);
// Polling survives a stopped server: show it once in the header instead of throwing every 2.5 s.
let offline = false;
async function poll(fns) {
  try {
    await Promise.all(fns.map(f => f()));
    if (offline) { offline = false; toast("Reconnected to the SpriteWaffle server"); }
  } catch (e) {
    if (e instanceof TypeError && !offline) {
      offline = true;
      $("#pComfy .dot").className = "dot bad"; $("#pComfy").lastChild.textContent = "SpriteWaffle server offline";
      $("#pWorker .dot").className = "dot bad"; $("#pWorker").lastChild.textContent = "start: spritewaffle ui";
    }
  }
}
setInterval(() => poll([loadStatus, loadQueue, loadJob]), 2500);
setInterval(() => poll([loadJobs]), 10000);
</script>
